# When a releases/<tag> PR (opened by the upstream publish job) is merged: tags the merge commit
# and creates a GitHub release with the PR's notes and the addon zip
name: release
on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'releases/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="${HEAD_REF#releases/}"
          (cd addon && zip -qr "$RUNNER_TEMP/Toybox.zip" Toybox)
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$RUNNER_TEMP/Toybox.zip" \
            --target "$TARGET" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Delete release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$HEAD_REF" || true
